<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="1024" height="1024" role="img" aria-label="Manifold connected translucent layers graph icon">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.82" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#282a2f"/><stop offset=".40" stop-color="#15171e"/><stop offset=".8" stop-color="#0c0d12"/><stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="topLight" cx=".31" cy=".01" r=".95">
      <stop stop-color="#51535b" stop-opacity=".32"/><stop offset=".5" stop-color="#232630" stop-opacity=".06"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="underLight" cx=".48" cy=".83" r=".66">
      <stop stop-color="#040508" stop-opacity=".32"/><stop offset="1" stop-color="#0b1016" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1=".12" y1="0" x2=".84" y2="1">
      <stop stop-color="#70727a" stop-opacity=".50"/><stop offset=".25" stop-color="#2d2d34" stop-opacity=".40"/><stop offset=".7" stop-color="#191b21" stop-opacity=".10"/><stop offset="1" stop-color="#53535a" stop-opacity=".42"/>
    </linearGradient>
    <filter id="outerShadow" x="-35%" y="-35%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="halo" x="-90%" y="-90%" width="280%" height="280%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softLight" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>

    <linearGradient id="pane1" x1="79" y1="126" x2="226" y2="357" gradientUnits="userSpaceOnUse">
      <stop stop-color="#325dc9" stop-opacity=".74"/><stop offset=".36" stop-color="#15327e" stop-opacity=".58"/><stop offset=".70" stop-color="#061849" stop-opacity=".64"/><stop offset="1" stop-color="#091947" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="pane1edge" x1="88" y1="165" x2="222" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7ebaff"/><stop offset=".31" stop-color="#688dff"/><stop offset=".85" stop-color="#303cad"/><stop offset="1" stop-color="#2155ce"/>
    </linearGradient>
    <linearGradient id="pane2" x1="206" y1="150" x2="329" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c72cb" stop-opacity=".68"/><stop offset=".32" stop-color="#08498b" stop-opacity=".56"/><stop offset=".71" stop-color="#04183f" stop-opacity=".61"/><stop offset="1" stop-color="#0b1d4f" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="pane2edge" x1="205" y1="174" x2="324" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70c5ff"/><stop offset=".45" stop-color="#2c9fff"/><stop offset="1" stop-color="#3974ee"/>
    </linearGradient>
    <linearGradient id="pane3" x1="309" y1="160" x2="412" y2="371" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17b8a9" stop-opacity=".61"/><stop offset=".29" stop-color="#087073" stop-opacity=".56"/><stop offset=".69" stop-color="#043b41" stop-opacity=".57"/><stop offset="1" stop-color="#062f33" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="pane3edge" x1="302" y1="177" x2="402" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78f5e7"/><stop offset=".38" stop-color="#39ded5"/><stop offset="1" stop-color="#12aa9e"/>
    </linearGradient>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white" stop-opacity=".16"/><stop offset=".28" stop-color="white" stop-opacity=".04"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bridge" x1="123" y1="224" x2="371" y2="242" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5ddff"/><stop offset=".23" stop-color="#a1c8ff"/><stop offset=".51" stop-color="#7fceff"/><stop offset=".75" stop-color="#83eaff"/><stop offset="1" stop-color="#92fcff"/>
    </linearGradient>
    <linearGradient id="bridgeGlow" x1="118" y1="237" x2="373" y2="237" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3c6bff"/><stop offset=".55" stop-color="#168aff"/><stop offset="1" stop-color="#16fff2"/>
    </linearGradient>
    <radialGradient id="node1" cx=".32" cy=".22" r=".85">
      <stop stop-color="#ffffff"/><stop offset=".57" stop-color="#d9efff"/><stop offset="1" stop-color="#b1dcff"/>
    </radialGradient>
    <radialGradient id="node2" cx=".29" cy=".23" r=".85">
      <stop stop-color="#edffff"/><stop offset=".62" stop-color="#b9ecff"/><stop offset="1" stop-color="#88d4fb"/>
    </radialGradient>
    <radialGradient id="node3" cx=".25" cy=".18" r=".96">
      <stop stop-color="#dbffff"/><stop offset=".55" stop-color="#b2fbfc"/><stop offset="1" stop-color="#77e5e9"/>
    </radialGradient>
  </defs>
  
  <rect x="11" y="24" width="436" height="425" rx="102" fill="#050507" opacity=".25" filter="url(#outerShadow)"/>
  <rect x="10.4" y="17.5" width="435.5" height="426.5" rx="103.5" fill="url(#base)"/>
  <rect x="10.4" y="17.5" width="435.5" height="426.5" rx="103.5" fill="url(#topLight)"/>
  <rect x="10.4" y="17.5" width="435.5" height="426.5" rx="103.5" fill="url(#underLight)"/>
  <rect x="11.5" y="18.6" width="433.3" height="424.3" rx="102.5" fill="none" stroke="url(#edge)" stroke-width="1.25"/>
  <path d="M113 21 Q226 13 337 21" fill="none" stroke="#aaa9ad" stroke-opacity=".14" stroke-width="1.3"/>

  <!-- Back pane: quadrilateral with gently curved, rounded corners. -->
  <path id="left-pane" d="M80 156 Q80 144 90 138 L210 83 Q229 76 229 94 L229 282 Q229 298 217 305 L93 363 Q78 370 78 352 Z" fill="url(#pane1)" stroke="url(#pane1edge)" stroke-width="2.3"/>
  <path d="M80 157 Q80 145 90 140 L211 85 Q224 79 227 88" fill="none" stroke="#c5d8ff" stroke-opacity=".39" stroke-width="1.2"/>
  <path d="M82 157 L82 354 Q82 368 94 361" fill="none" stroke="#4170ff" stroke-opacity=".68" stroke-width="1.6"/>
  <!-- Middle pane overlays the rear pane, with bluer transmitted light. -->
  <path id="middle-pane" d="M204 163 Q204 153 213 146 L309 95 Q325 84 325 104 L325 298 Q325 310 315 316 L218 373 Q202 383 202 362 Z" fill="url(#pane2)" stroke="url(#pane2edge)" stroke-width="2.3"/>
  <path d="M205 164 Q205 153 214 147 L310 97 Q323 91 323 99" fill="none" stroke="#a4d9ff" stroke-opacity=".42" stroke-width="1.25"/>
  <path d="M205 166 L205 362 Q205 380 216 374" fill="none" stroke="#359dff" stroke-opacity=".72" stroke-width="1.6"/>
  <!-- Foreground sea-green pane. -->
  <path id="right-pane" d="M308 173 Q308 160 319 153 L385 114 Q404 103 405 122 L405 295 Q405 310 392 318 L320 365 Q307 372 307 352 Z" fill="url(#pane3)" stroke="url(#pane3edge)" stroke-width="2.3"/>
  <path d="M309 173 Q309 161 319 155 L387 116 Q401 109 403 117" fill="none" stroke="#b0fff4" stroke-opacity=".46" stroke-width="1.25"/>
  <path d="M309 178 L309 355 Q309 369 320 363" fill="none" stroke="#37e2d6" stroke-opacity=".76" stroke-width="1.6"/>
  <!-- Connection routed in front of all three translucent planes. -->
  <path id="graph-line-glow" d="M126 237 H194 Q201 237 209 234 L251 211 Q258 208 266 213 L360 246" fill="none" stroke="url(#bridgeGlow)" stroke-width="18" opacity=".43" filter="url(#halo)" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="graph-line" d="M126 237 H194 Q201 237 209 234 L251 211 Q258 208 266 213 L360 246" fill="none" stroke="url(#bridge)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="126" cy="237" r="17.5" fill="#b6d7ff" opacity=".38" filter="url(#softLight)"/>
  <circle id="node-left" cx="126" cy="237" r="17.5" fill="url(#node1)"/>
  <circle cx="255" cy="211" r="17" fill="#8cd9ff" opacity=".38" filter="url(#softLight)"/>
  <circle id="node-center" cx="255" cy="211" r="17" fill="url(#node2)"/>
  <circle cx="360" cy="246" r="17.5" fill="#82fff4" opacity=".30" filter="url(#softLight)"/>
  <circle id="node-right" cx="360" cy="246" r="17.5" fill="url(#node3)"/>
</svg>