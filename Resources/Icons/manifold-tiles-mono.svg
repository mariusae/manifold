<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="1024" height="1024" role="img" aria-label="Manifold: a sidebar and two columns of tiles, in a window, in grey">
  <!-- The app: its sidebar, and its tiles in two columns of uneven
       heights, as it lays out blocks, in a window — each a color of the M's
       gradient (or, the monochrome one, a grey as light). -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.82" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffffff"/><stop offset=".45" stop-color="#fafbfc"/><stop offset=".85" stop-color="#eff1f5"/><stop offset="1" stop-color="#e9ecf1"/>
    </linearGradient>
    <radialGradient id="topLight" cx=".31" cy=".01" r=".95">
      <stop stop-color="#ffffff" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="underLight" cx=".48" cy=".83" r=".66">
      <stop stop-color="#dfe3ec" stop-opacity=".55"/><stop offset="1" stop-color="#e8ebf1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1=".12" y1="0" x2=".84" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".9"/><stop offset=".35" stop-color="#d9dce3" stop-opacity=".55"/><stop offset=".75" stop-color="#c4c9d3" stop-opacity=".45"/><stop offset="1" stop-color="#b8bdc8" stop-opacity=".6"/>
    </linearGradient>
    <filter id="outerShadow" x="-35%" y="-35%" width="170%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b2233" flood-opacity=".16"/></filter>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9297a0"/><stop offset="1" stop-color="#767b85"/></linearGradient>
    <linearGradient id="tile-1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cdd1d8"/><stop offset="1" stop-color="#b7bcc4"/></linearGradient>
    <linearGradient id="tile-2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6b6f77"/><stop offset="1" stop-color="#4a4f57"/></linearGradient>
    <linearGradient id="tile-3" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7dae0"/><stop offset="1" stop-color="#c3c6cd"/></linearGradient>
    <linearGradient id="tile-4" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#82878f"/><stop offset="1" stop-color="#646973"/></linearGradient>
  </defs>
  <rect x="11" y="24" width="436" height="425" rx="102" fill="#1b2233" opacity=".16" filter="url(#outerShadow)"/>
  <rect x="10.4" y="17.5" width="435.5" height="426.5" rx="103.5" fill="url(#base)"/>
  <rect x="10.4" y="17.5" width="435.5" height="426.5" rx="103.5" fill="url(#topLight)"/>
  <rect x="10.4" y="17.5" width="435.5" height="426.5" rx="103.5" fill="url(#underLight)"/>
  <rect x="11.5" y="18.6" width="433.3" height="424.3" rx="102.5" fill="none" stroke="url(#edge)" stroke-width="1.25"/>
  <rect x="82.7" y="83.7" width="292.5" height="292.5" rx="40.8" fill="#e2e6ed"/>
  <g filter="url(#lift)">
    <rect x="101.4" y="102.4" width="54.4" height="255.1" rx="17.0" fill="url(#sidebar)"/>
    <rect x="102.2" y="103.2" width="52.9" height="253.6" rx="16.3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="166.1" y="102.4" width="90.1" height="157.4" rx="17.0" fill="url(#tile-1)"/>
    <rect x="166.8" y="103.2" width="88.6" height="155.9" rx="16.3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="166.1" y="270.1" width="90.1" height="87.5" rx="17.0" fill="url(#tile-2)"/>
    <rect x="166.8" y="270.8" width="88.6" height="86.0" rx="16.3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="266.4" y="102.4" width="90.1" height="74.3" rx="17.0" fill="url(#tile-3)"/>
    <rect x="267.2" y="103.2" width="88.6" height="72.8" rx="16.3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="266.4" y="187.0" width="90.1" height="170.6" rx="17.0" fill="url(#tile-4)"/>
    <rect x="267.2" y="187.7" width="88.6" height="169.1" rx="16.3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
  </g>
</svg>
